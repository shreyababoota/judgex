<!DOCTYPE html>
<html>

<head>
    <title>Online Judge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container-full">

<h1 class="site-title">Online Judge</h1>

<header class="navbar">

    <div class="nav-left" id="nav-left"></div>

    <div class="nav-right">

        <div id="nav-links"></div>

        <button id="theme-toggle" class="secondary">🌙</button>

    </div>

</header>
{% block content %}{% endblock %}

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const left = document.getElementById("nav-left");
    const links = document.getElementById("nav-links");
    const toggle = document.getElementById("theme-toggle");

    /* ======================
       Navbar Setup
    ====================== */

    left.innerHTML = `<a href="/problems-page">Problems</a>`;

    // Not logged in
    if(!token){
        links.innerHTML = `
            <a href="/signup-page">Signup</a>
            <a href="/login-page">Login</a>
            <a href="/admin/login">Admin Login</a>
        `;
    }
    // Admin navbar
    else if(role === "ADMIN"){
        links.innerHTML = `
            <a href="/admin/submissions-page" class="desktop-only">All Submissions</a>
            <a href="/admin/create-problem" class="desktop-only">Create Problem</a>
            <a href="/admin/add-testcase" class="desktop-only">Add Testcase</a>
            <a href="/admin/users-page" class="desktop-only">Manage Users</a>
            
            <a href="/profile-page" class="desktop-only">Profile</a>
            
            <div class="dropdown mobile-only" id="more-dropdown-container">
                <button id="more-btn" class="run-btn">Menu ▾</button>
                <div id="more-dropdown" class="dropdown-content">
                    <a href="/admin/submissions-page">All Submissions</a>
                    <a href="/admin/create-problem">Create Problem</a>
                    <a href="/admin/add-testcase">Add Testcase</a>
                    <a href="/admin/users-page">Manage Users</a>
                    <a href="/profile-page">Profile</a>
                </div>
            </div>

            <a href="#" onclick="logout()">Logout</a>
        `;
    }
    // Normal user navbar
    else {
        links.innerHTML = `
            <a href="/submissions-page">Submissions</a>
            
            <a href="/profile-page" class="desktop-only">Profile</a>
            
            <div class="dropdown mobile-only" id="more-dropdown-container">
                <button id="more-btn" class="run-btn">Menu ▾</button>
                <div id="more-dropdown" class="dropdown-content">
                    <a href="/profile-page">Profile</a>
                </div>
            </div>

            <a href="#" onclick="logout()">Logout</a>
        `;
    }

    /* ======================
       Dropdown Toggle Logic
    ====================== */
    // Attach this AFTER the HTML is injected into the DOM
    const moreBtn = document.getElementById("more-btn");
    const dropdownContainer = document.getElementById("more-dropdown-container");

    if (moreBtn && dropdownContainer) {
        moreBtn.onclick = (e) => {
            e.stopPropagation(); // Prevents click from bubbling up
            dropdownContainer.classList.toggle("show");
        };

        // Optional: Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!dropdownContainer.contains(e.target)) {
                dropdownContainer.classList.remove('show');
            }
        });
    }

    /* ======================
       Theme Toggle
    ====================== */

    if(localStorage.getItem("theme") === "dark"){
        document.body.classList.add("dark");
        toggle.textContent = "☀️";
    }

    toggle.onclick = () => {
        document.body.classList.toggle("dark");
        if(document.body.classList.contains("dark")){
            toggle.textContent = "☀️";
            localStorage.setItem("theme","dark");
        } else {
            toggle.textContent = "🌙";
            localStorage.setItem("theme","light");
        }
    }
});

/* ======================
   Logout
====================== */
function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    window.location = "/login-page";
}
</script>
</body>
</html>
