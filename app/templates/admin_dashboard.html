{% extends "base.html" %}

{% block content %}

<div class="card">

<h2>Admin Dashboard</h2>

<h3>Users</h3>

<table>
<thead>
<tr>
<th>ID</th>
<th>Email</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>

<tbody id="users-body"></tbody>

</table>

</div>

<script>

async function loadUsers(){

    const token = localStorage.getItem("token");

    const res = await fetch("/admin/users",{
        headers:{
            "Authorization":"Bearer " + token
        }
    });

    const data = await res.json();

    const body = document.getElementById("users-body");

    body.innerHTML = "";

    data.users.forEach(u => {

        let button = "";

        if(u.role !== "ADMIN"){
            button = `<button onclick="promoteUser(${u.id})">Promote</button>`;
        }

        const row = `
        <tr>
            <td>${u.id}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td>${button}</td>
        </tr>
        `;

        body.innerHTML += row;
    });
}

async function promoteUser(userId){

    const token = localStorage.getItem("token");

    const res = await fetch(`/admin/promote/${userId}`,{
        method:"POST",
        headers:{
            "Authorization":"Bearer " + token
        }
    });

    const data = await res.json();

    alert(data.message || data.error);

    loadUsers(); // refresh table
}

loadUsers();

</script>

{% endblock %}
