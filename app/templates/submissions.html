{% extends "base.html" %}

{% block content %}

<h2>Your Submissions</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Problem</th>
<th>Language</th>
<th>Verdict</th>
<th>Time</th>
<th>Memory</th>
<th>Submitted</th>
<th>Code</th>
</tr>
</thead>

<tbody id="submissions-body">
</tbody>

</table>
<div id="codeModal" class="code-modal">
<div class="code-modal-content">

<div class="code-header">
<span>Submission Code</span>
<button onclick="closeCode()">Close</button>
</div>

<pre id="codeViewer"></pre>

</div>
</div>

<div id="pagination"></div>

<script>

let currentPage = 1;

async function loadSubmissions(page = 1) {

    currentPage = page;

    const token = localStorage.getItem("token");

    const res = await fetch(`/submissions?page=${page}`, {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await res.json();

    const body = document.getElementById("submissions-body");
    body.innerHTML = "";

    data.submissions.forEach(sub => {

        const verdict = sub.verdict || sub.status;

        let color = "";

        if(verdict === "ACCEPTED") color = "green";
        else if(verdict === "WRONG_ANSWER") color = "red";
        else if(verdict === "TLE") color = "orange";
        else if(verdict === "RUNTIME_ERROR") color = "purple";
        else if(verdict === "IN_QUEUE") color = "#2563eb";
        else if(verdict === "RUNNING") color = "#2563eb";
        else color = "#555";

        let cls = "";
        if(verdict === "IN_QUEUE" || verdict === "RUNNING"){
            cls = "judging";
        }

const memoryMB = ((sub.memory_taken ?? 0) / 1024).toFixed(2) + " MB";        const timeMS = (sub.time_taken ?? 0) + " ms";

        const row = `
<tr>

<td>${sub.id}</td>

<td>
<a href="/problem-page/${sub.problem_id}">
${sub.problem_title}
</a>
</td>

<td>${sub.language}</td>

<td class="${cls}" style="color:${color}; font-weight:600">
${verdict}
</td>

<td>${timeMS}</td>

<td>${memoryMB}</td>

<td>${new Date(sub.submitted_at).toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata"
})}</td>

<td>
<button onclick="viewCode(${sub.id})">View</button>
</td>

</tr>
`;

        body.innerHTML += row;
    });

    renderPagination(data.page, data.total_pages);
}

function renderPagination(page, totalPages) {

    const container = document.getElementById("pagination");

    let html = "";

    if(page > 1)
        html += `<button onclick="loadSubmissions(${page-1})">Prev</button>`;

    html += `<span style="margin:0 10px">Page ${page}</span>`;

    if(page < totalPages)
        html += `<button onclick="loadSubmissions(${page+1})">Next</button>`;

    container.innerHTML = html;
}

window.onload = () => {

    loadSubmissions(1);

    setInterval(() => {
        loadSubmissions(currentPage);
    }, 5000);

};

async function viewCode(id){

    const token = localStorage.getItem("token")

    const res = await fetch(`/submission/${id}/code`,{
        headers:{
            "Authorization":"Bearer " + token
        }
    })

    const data = await res.json()

    document.getElementById("codeViewer").textContent = data.code
    document.getElementById("codeModal").style.display = "flex"

}
function closeCode(){
    document.getElementById("codeModal").style.display = "none"
}
</script>

{% endblock %}
